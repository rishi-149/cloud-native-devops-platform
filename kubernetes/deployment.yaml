apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloud-native-devops
  namespace: devops-platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloud-native-devops

  template:
    metadata:
      labels:
        app: cloud-native-devops

    spec:
      containers:
        - name: cloud-native-devops
          image: cloud-native-devops:v4
          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          volumeMounts:
            - name: app-storage
              mountPath: /data

      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: app-storage